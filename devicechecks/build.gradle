plugins { id 'com.android.application' }
def fixtureSources = tasks.register('syncFixtureSources', Sync) {
    from('../app/src/main/java') {
        include 'dev/sapphire/companion/PhoneActionPolicy.java', 'dev/sapphire/companion/PhoneActionIntents.java',
                'dev/sapphire/companion/LinkCrypto.java', 'dev/sapphire/companion/GattFrames.java', 'dev/sapphire/companion/IncomingFileTransfer.java'
    }
    into layout.buildDirectory.dir('generated/isolated')
}
android {
    namespace 'dev.sapphire.fixture'
    compileSdk 36
    defaultConfig { applicationId 'dev.sapphire.fixture'; minSdk 28; targetSdk 36; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/isolated'))
}
tasks.named('preBuild').configure { dependsOn fixtureSources }
